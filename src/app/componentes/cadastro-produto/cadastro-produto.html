<div class="container mt-4">

  <h2>Cadastrar Produto</h2>

  <form (ngSubmit)="salvarProduto()">

    <div class="mb-3">
      <label class="form-label">Nome do Produto</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="produto.produto"
        name="produto"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Descrição</label>
      <textarea
        class="form-control"
        [(ngModel)]="produto.descricao"
        name="descricao"
        required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Foto (Nome do Arquivo)</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="produto.foto"
        name="foto">
    </div>

    <div class="mb-3">
      <label class="form-label">Preço</label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="produto.preco"
        name="preco"
        min="0"
        required>
    </div>

    <button type="submit" class="btn btn-success">
      Cadastrar Produto
    </button>

  </form>

</div>
